name: Fetch Amazon Data

on:
  # Run on schedule (before main update job)
  # Weekly schedule off for Italy until the generated data leaves git (~370 MB
  # per run) and the fetch step fits its timeout (Poste alone takes ~100 min).
  # Run by hand meanwhile.
  # schedule:
  #   - cron: '0 0 * * 2'  # Tuesday 00:00 UTC, before the main update at 02:00
  workflow_dispatch:
    inputs:
      force_save:
        description: 'Accept the fetched count as the new baseline even if it dropped sharply'
        type: boolean
        default: false

jobs:
  fetch-amazon:
    runs-on: ubuntu-latest
    # Commits the refreshed cache; the default workflow token is read-only
    permissions:
      contents: write
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # shapely: the fetcher lays its search grid over the municipality polygons
          pip install requests playwright shapely
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch Amazon data
        id: fetch
        run: python scripts/amazon_fetch_all.py
        timeout-minutes: 150
        continue-on-error: true
        env:
          CACHE_GUARD_FORCE: ${{ inputs.force_save && '1' || '' }}

      - name: Report anomaly
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Amazon data anomaly detected — existing cache preserved"
          echo "## ⚠️ Amazon data anomaly" >> "$GITHUB_STEP_SUMMARY"
          echo "Location count dropped >20% or returned 0 results." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing cache preserved. If next Monday's fetch lands within 5% of this one," >> "$GITHUB_STEP_SUMMARY"
          echo "the guard accepts it as the new baseline automatically. To accept it now, re-run" >> "$GITHUB_STEP_SUMMARY"
          echo "this workflow with \`force_save\` enabled." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # Runs whatever the fetch outcome. The location cache only changes when the
      # guard actually saved, but data/fetch_history.json changes on every run —
      # and a blocked run's record is exactly what next week confirms against, so
      # gating this step on success would keep the cache frozen forever.
      - name: Commit and push Amazon data
        run: |
          # Separate adds on purpose: one `git add` with a missing pathspec
          # stages nothing at all, and fetch_history.json does not exist
          # until the guard has run at least once.
          git add data/amazon_all_locations.json 2>/dev/null || true
          git add data/fetch_history.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          if git diff --staged --name-only | grep -q 'amazon_all_locations.json'; then
            msg="🤖 Update Amazon data - $(date +'%Y-%m-%d %H:%M UTC')"
          else
            msg="🤖 Record Amazon fetch count (cache unchanged) - $(date +'%Y-%m-%d %H:%M UTC')"
          fi

          git commit -m "$msg"
          # Commit first, then rebase onto whatever reached main during the run
          # (a code push, the other workflow); retry in case main moves again.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
