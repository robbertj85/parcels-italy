name: Update Pakketpunten Data

on:
  # Weekly schedule off for Italy until the generated data leaves git (~370 MB
  # per run) and the fetch step fits its timeout (Poste alone takes ~100 min).
  # Run by hand meanwhile.
  # schedule:
  #   # Weekly on Tuesday 02:00 UTC: after the Amazon workflow, and a day after
  #   # the Dutch viewer so the two don't hit the shared carrier APIs together
  #   - cron: '0 2 * * 2'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_save:
        description: 'Accept the fetched counts as the new baselines even if they dropped sharply'
        type: boolean
        default: false


jobs:
  update-data:
    runs-on: ubuntu-latest
    # The job commits and pushes the refreshed data; new repositories give
    # the workflow token read-only access by default
    permissions:
      contents: write
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # Every carrier of the country except Amazon (own workflow, needs a
      # browser). Never fails: a carrier whose fetch fails or is blocked by the
      # cache guard keeps its previous cache, and is listed in the anomalies file.
      - name: Fetch carrier data (nationwide caches)
        run: python scripts/fetch_all.py --skip Amazon --anomalies /tmp/anomaly_carriers.txt
        working-directory: ${{ github.workspace }}
        timeout-minutes: 90
        env:
          CACHE_GUARD_FORCE: ${{ inputs.force_save && '1' || '' }}

      - name: Report anomalies
        run: |
          if [ -f /tmp/anomaly_carriers.txt ]; then
            anomalies=$(cat /tmp/anomaly_carriers.txt)
            echo "::warning::Data anomalies for: ${anomalies}— caches preserved, will retry next week"
            echo "## ⚠️ Data anomalies detected" >> "$GITHUB_STEP_SUMMARY"
            echo "The following carriers failed, had a >20% drop or 0 results: **${anomalies}**" >> "$GITHUB_STEP_SUMMARY"
            echo "Existing caches preserved. Will retry automatically next week." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate pakketpunten data
        run: |
          python scripts/batch_generate.py
          python scripts/create_national_overview.py
          python scripts/create_provincial_boundaries.py
          python scripts/create_national_coverage.py
        working-directory: ${{ github.workspace }}
        # Pure geometry on the local caches and boundary file; no network calls
        timeout-minutes: 60

      # Reads the GeoJSON just written, so it has to follow batch_generate.
      # The coverage pass buffers every point and intersects with the municipal
      # outline, which is why it gets its own step and its own timeout.
      - name: Compute statistics
        run: python scripts/compute_statistics.py
        working-directory: ${{ github.workspace }}
        timeout-minutes: 20

      - name: Update totals history
        run: python scripts/update_totals_history.py
        working-directory: ${{ github.workspace }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push if changed
        run: |
          # Carrier caches (Amazon's is committed by its own workflow, and
          # re-adding the unchanged file here is a no-op)
          git add data/*_all_locations.json 2>/dev/null || true
          # The guard's count history changes on every run, including one where it
          # blocked the save -- and that blocked record is what next week's run
          # confirms the new baseline against, so it has to be committed too.
          git add data/fetch_history.json 2>/dev/null || true
          # Municipality GeoJSON, province boundary chunks and the derived JSON.
          # The <national>-boundaries file is gitignored; naming it explicitly
          # would make `git add` refuse, hence find.
          find webapp/public/data -maxdepth 1 -name "*.geojson" -not -name "*-boundaries.geojson" -exec git add {} +
          git add webapp/public/data/boundaries webapp/public/data/geo 2>/dev/null || true
          # The national view's compact point file (create_national_overview.py)
          git add webapp/public/data/*-points.json 2>/dev/null || true
          git add webapp/public/data/summary.json webapp/public/data/totals_history.json webapp/public/data/statistics.json webapp/public/municipalities.json 2>/dev/null || true
          # Build commit message with anomaly note if applicable
          msg="🤖 Update pakketpunten data - $(date +'%Y-%m-%d %H:%M UTC')"
          if [ -f /tmp/anomaly_carriers.txt ]; then
            carriers=$(cat /tmp/anomaly_carriers.txt)
            msg="${msg} (* ${carriers}used previous cache)"
          fi
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "$msg"
          # Commit first, then rebase onto whatever reached main during the run
          # (a code push, the other workflow); retry in case main moves again.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1

      # Every weekly run adds a data commit. GitHub recommends repositories stay
      # under ~1 GB and gets strict around 5 GB; past WARN_KB it is time to move
      # the data out of git (e.g. a release asset, object storage or LFS).
      - name: Check repository size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WARN_KB: 2000000
        run: |
          size_kb=$(gh api "repos/${{ github.repository }}" --jq .size)
          size_mb=$((size_kb / 1024))
          echo "Repository size: ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_kb" -gt "$WARN_KB" ]; then
            echo "::warning::Repository is ${size_mb} MB (warn above $((WARN_KB / 1024)) MB): plan to move the data out of git"
            echo "## ⚠️ Repository size ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"
            echo "Time to move the weekly data out of git. See CLAUDE.md, Repository size." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Last on purpose. A stale carrier must never stop the fresh data for the
      # other carriers from being published, so this gate runs after the push.
      # It is the tripwire the guard lacks: a blocked save still reports green,
      # which is how Amazon went eight weeks without anyone noticing.
      - name: Check cache freshness
        run: python scripts/check_cache_freshness.py --max-age-days 21
        working-directory: ${{ github.workspace }}
